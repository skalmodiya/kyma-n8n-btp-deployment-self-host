apiVersion: apps/v1
kind: Deployment

metadata:
  name: n8n
  namespace: n8n-v2

spec:

  replicas: 1

  selector:
    matchLabels:
      app: n8n

  template:

    metadata:
      labels:
        app: n8n

    spec:

      containers:

      - name: n8n

        image: n8nio/n8n:latest

        ports:
        - containerPort: 5678

        env:

        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"

        - name: N8N_HOST
          value: "n8n-v2"

        - name: N8N_PROTOCOL
          value: "https"

        - name: N8N_PORT
          value: "5678"

        - name: N8N_EDITOR_BASE_URL
          value: "/"

        - name: WEBHOOK_URL
          value: "/"

        envFrom:

        - secretRef:
            name: n8n-secret